# Cessna 172 Skyhawk Configuration
# Realistic configuration for the popular Cessna 172 training aircraft

aircraft:
  name: "Cessna 172 Skyhawk"
  icao_code: "C172"
  manufacturer: "Cessna"
  fixed_gear: true  # C172 has fixed landing gear (not retractable)

  # Flight model configuration
  flight_model: "Simple6DOF"
  flight_model_config:
    wing_area_sqft: 174.0        # Wing area in square feet
    weight_lbs: 2450.0            # Empty weight + pilot + fuel
    max_thrust_lbs: 180.0         # Maximum thrust from engine (HP converted) - DEPRECATED, using propeller model now
    drag_coefficient: 0.035       # Cd0 - parasite drag (realistic for C172 with fixed gear)
    lift_coefficient_slope: 0.09  # Cl_alpha - lift curve slope (legacy, use cl_alpha instead)

    # Aerodynamic coefficients (NACA 2412 airfoil characteristics)
    cl_0: 0.30                    # Zero-AOA lift coefficient (due to NACA 2412 camber)
    cl_alpha: 0.105               # Lift curve slope per degree AOA (finite wing corrected)
    cl_max: 1.6                   # Maximum CL clean configuration (at stall)
    stall_aoa_deg: 17.0           # Stall angle of attack in degrees (clean)
    cl_flap_delta: 0.5            # CL increase per unit flap deflection (0-1)
    cl_max_flaps: 2.1             # Maximum CL with full flaps (40°)

    # Stability and damping coefficients (for improved keyboard control)
    pitch_damping_coefficient: -25.0  # Cmq - pitch rate damping (increased from -18 for better altitude hold)
    roll_damping_coefficient: -8.0    # Clp - roll rate damping
    yaw_damping_coefficient: -6.0     # Cnr - yaw rate damping

  # Flap configuration (aircraft-specific discrete positions)
  # C172 has 4 flap positions: UP (0°), 10°, 20°, 30° (some models have 40°)
  flaps:
    positions:
      - name: "UP"
        degrees: 0
        normalized: 0.0
      - name: "10"
        degrees: 10
        normalized: 0.33
      - name: "20"
        degrees: 20
        normalized: 0.67
      - name: "FULL"
        degrees: 30
        normalized: 1.0
    default_position: 0
    max_speed_kts: 110        # Vfe - max speed with flaps extended
    transition_time_sec: 3.0  # Time to move from fully retracted to fully extended

  # Propeller configuration
  propeller:
    type: "fixed_pitch"           # Fixed-pitch propeller (typical for C172)
    diameter_m: 1.905             # 75 inches = 1.905 meters
    pitch_ratio: 0.6              # Pitch/diameter ratio (0.6 = climb prop)
    efficiency_static: 0.75       # Efficiency at v=0 (realistic for fixed-pitch climb prop: 0.75-0.80)
    efficiency_cruise: 0.88       # Peak efficiency at cruise speed (increased for better climb)
    cruise_advance_ratio: 0.5     # Advance ratio where efficiency peaks (moved closer to climb speed)
    static_thrust_multiplier: 5.8   # Empirical correction for momentum theory
                                    # Increased to provide adequate climb thrust at J=0.3-0.5
                                    # Real C172 maintains ~2,400N thrust through climb regime

  # Aircraft systems plugins
  plugins:
    # Piston engine - Lycoming O-360
    - plugin: "simple_piston_engine"
      instance_id: "engine"
      config:
        max_power_hp: 180           # 180 HP Lycoming O-360
        max_rpm: 2700               # Maximum RPM
        idle_rpm: 600               # Idle RPM
        fuel_consumption_base_gph: 9.5  # Base fuel consumption at full power
        displacement_liters: 5.9    # Engine displacement
        cylinders: 4                # Number of cylinders
        aspiration: "naturally_aspirated"
        # Starter motor requirements (configurable for different aircraft)
        starter_min_voltage: 11.0   # Minimum battery voltage to engage starter
        starter_current_draw: 150.0 # Starter motor current draw in amps
        requires_fuel: true         # Whether fuel must be available to start
        requires_magnetos: true     # Whether magnetos must be on to start

    # Electrical system - 28V system
    - plugin: "simple_electrical_system"
      instance_id: "electrical"
      config:
        battery_voltage: 12.6       # 12V lead-acid battery (resting voltage)
        battery_capacity_ah: 35.0   # 35 Ah capacity
        alternator_voltage: 14.0    # Regulated alternator voltage
        alternator_amps: 60.0       # 60A alternator
        base_load_amps: 5.0         # Base electrical load

    # Fuel system - Two wing tanks
    - plugin: "simple_fuel_system"
      instance_id: "fuel"
      config:
        left_tank_capacity: 26.0    # Left tank capacity in gallons
        right_tank_capacity: 26.0   # Right tank capacity in gallons
        unusable_fuel: 2.0          # Unusable fuel per tank
        fuel_selector: "both"       # Initial selector position

  # Electrical system detailed configuration
  electrical:
    implementation: "simple_12v"
    battery:
      voltage_nominal: 12.6        # Fully charged resting voltage (lead-acid)
      capacity_ah: 35.0             # Total battery capacity in amp-hours
      internal_resistance: 0.05     # Internal resistance in ohms
    alternator:
      max_amps: 60.0                # Maximum alternator output current
      voltage_regulated: 14.0       # Regulated charging voltage
      rpm_threshold: 800            # Minimum engine RPM to produce power
    loads:
      master_relay:
        amps: 0.1
        essential: true
        min_voltage: 10.0
      starter_motor:
        amps: 150.0
        essential: true
        min_voltage: 11.0
      fuel_pump:
        amps: 5.0
        essential: false
        min_voltage: 10.0
      avionics:
        amps: 10.0
        essential: false
        min_voltage: 11.5
      nav_lights:
        amps: 1.5
        essential: false
        min_voltage: 10.0
      beacon:
        amps: 2.0
        essential: false
        min_voltage: 10.0
      strobe:
        amps: 3.0
        essential: false
        min_voltage: 10.0
      taxi_light:
        amps: 4.0
        essential: false
        min_voltage: 10.0
      landing_light:
        amps: 8.0
        essential: false
        min_voltage: 10.0
      pitot_heat:
        amps: 7.0
        essential: false
        min_voltage: 10.0

  # Fuel system detailed configuration
  fuel:
    implementation: "simple_gravity"
    fuel_type: "avgas_100ll"
    lbs_per_gallon: 6.0
    tanks:
      left:
        capacity_total: 28.0        # Total tank capacity (including unusable)
        capacity_usable: 26.0       # Usable fuel capacity
        initial_quantity: 26.0      # Start with full usable fuel
        fuel_type: "avgas_100ll"
        position: [-5.0, 0.0, -8.0] # Relative to CG (x, y, z in feet)
      right:
        capacity_total: 28.0
        capacity_usable: 26.0
        initial_quantity: 26.0
        fuel_type: "avgas_100ll"
        position: [-5.0, 0.0, 8.0]
    selector_positions: [OFF, LEFT, RIGHT, BOTH]

  # Audio configuration
  audio:
    engine_sounds:
      start: "assets/sounds/aircraft/cessna172_start.wav"      # Engine start/crank sound
      idle: "assets/sounds/aircraft/cessna172_idle.wav"        # Engine running/idle (looping)
      shutdown: "assets/sounds/aircraft/cessna172_shutdown.wav"  # Engine shutdown sound
      pitch_idle: 1.0       # Audio pitch at 0% throttle
      pitch_full: 1.9       # Audio pitch at 100% throttle
    click_sounds:
      switch_on: "assets/sounds/aircraft/click_switch_on.mp3"
      switch_off: "assets/sounds/aircraft/click_switch_off.mp3"
      button: "assets/sounds/aircraft/click_button.mp3"
      knob: "assets/sounds/aircraft/click_knob.mp3"
    system_sounds:
      battery_on: "assets/sounds/aircraft/batteryon1.wav"
      battery_off: "assets/sounds/aircraft/batteryoff1.wav"
      battery_loop: "assets/sounds/aircraft/batteryloop1.wav"
      fuel_pump: "assets/sounds/aircraft/fuelpump1.mp3"

  # Weight and balance configuration
  weight_balance:
    empty_weight: 1600.0            # Empty aircraft weight (lbs)
    empty_moment: 136000.0          # Empty aircraft moment (lb-in, CG ~85 inches)
    max_gross_weight: 2550.0        # Maximum gross weight (lbs)
    cg_limits:
      forward: 82.9                 # Forward CG limit (inches from datum)
      aft: 95.5                     # Aft CG limit (inches from datum)
    stations:
      fuel:
        - name: "fuel_main"         # Combined fuel tanks (52 gal total)
          arm: 95.0                 # Arm position (inches from datum, aft of CG)
          max_weight: 312.0         # Max fuel weight (52 gal × 6 lb/gal)
          initial_weight: 312.0     # Start with full tanks
      seats:
        - name: "seat_pilot"
          arm: 85.0                 # Front seat arm
          max_weight: 200.0         # Max pilot + baggage
          initial_weight: 200.0     # Start with pilot (200 lbs)
        - name: "seat_copilot"
          arm: 85.0                 # Front seat arm
          max_weight: 200.0         # Max copilot + baggage
          initial_weight: 0.0       # Start empty
        - name: "seat_rear_left"
          arm: 118.0                # Rear seat arm
          max_weight: 200.0         # Max passenger + baggage
          initial_weight: 0.0       # Start empty
        - name: "seat_rear_right"
          arm: 118.0                # Rear seat arm
          max_weight: 200.0         # Max passenger + baggage
          initial_weight: 0.0       # Start empty
      cargo:
        - name: "cargo_bay"
          arm: 142.0                # Baggage area arm
          max_weight: 120.0         # Max baggage weight
          initial_weight: 0.0       # Start empty

  # Performance configuration (from C172 POH)
  performance:
    reference_weight_lbs: 2550.0    # Max gross weight (reference for POH data)
    wing_area_sqft: 174.0           # Wing area in square feet
    max_power_hp: 180.0             # Maximum engine power
    cl_max_clean: 1.4               # Maximum lift coefficient (clean configuration)
    cl_max_landing: 2.0             # Maximum lift coefficient (full flaps)
    vspeeds_reference:              # V-speeds at reference weight (2550 lbs)
      V_S: 47                       # Stall speed clean (KIAS)
      V_SO: 40                      # Stall speed landing config (KIAS)
      V_R: 55                       # Rotation speed (KIAS)
      V_X: 59                       # Best angle of climb (KIAS)
      V_Y: 73                       # Best rate of climb (KIAS)
    takeoff_reference:              # Takeoff performance at reference weight, sea level, ISA
      ground_roll_ft: 960           # Ground roll distance (paved runway)
      distance_50ft: 1685           # Distance to clear 50 ft obstacle
      climb_rate_fpm: 730           # Rate of climb at sea level

  # Landing limits and surface compatibility
  landing_limits:
    max_sink_rate_fpm: 600          # Maximum touchdown sink rate before damage
    hard_landing_fpm: 400           # Sink rate triggering hard landing warning
    max_crosswind_kts: 15           # Maximum demonstrated crosswind component
    max_tailwind_kts: 10            # Maximum tailwind for landing
    approach_speed_min_kts: 60      # Minimum approach speed (1.3 × V_SO)
    approach_speed_max_kts: 80      # Maximum approach speed before long landing
    max_pitch_touchdown_deg: 12     # Maximum pitch at touchdown (tail strike)
    max_bank_touchdown_deg: 5       # Maximum bank at touchdown

  # Surface compatibility - what surfaces this aircraft can operate on
  surface_compatibility:
    allowed_surfaces:               # Surfaces where normal operation is allowed
      - asphalt
      - concrete
      - grass                       # C172 can handle well-maintained grass
      - turf
    restricted_surfaces:            # Surfaces with increased risk/damage
      - gravel                      # Risk of propeller damage, reduced braking
      - dirt                        # Soft field technique required
    prohibited_surfaces:            # Surfaces that will cause damage/crash
      - sand                        # Nose gear will dig in
      - water                       # Not a seaplane
    grass_min_length_ft: 2000       # Minimum grass runway length (longer than paved)
    soft_field_penalty: 1.3         # Multiply takeoff/landing distance on soft fields

  # Initial state
  initial_state:
    position:
      latitude: 37.615223          # San Francisco area
      longitude: -122.389977
      altitude_ft: 0                # On ground
    fuel:
      left_tank_gallons: 26.0       # Start with full tanks
      right_tank_gallons: 26.0
    electrical:
      battery_master: false         # Start with battery off
      alternator_switch: false      # Start with alternator off
    engine:
      running: false                # Engine not running
      mixture: 0.0                  # Idle cutoff (full lean)
      throttle: 0.0                 # Idle
    controls:
      parking_brake: true           # Parking brake set
      gear_down: true               # Fixed gear (always down)
